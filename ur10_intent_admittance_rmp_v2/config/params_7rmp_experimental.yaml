# UR10 RMPflow RViz Parameters

rmpflow_controller:
  ros__parameters:
    # Real-time default. Use casadi_rmp2 only for reference/equivalence checks.
    solver_backend: "pinocchio_direct"

    # RMP solver common
    root_solve_offset: 0.001
    casadi_rmp2_max_obstacles: 24
    casadi_rmp2_jit: true

    # Collision RMP
    # lula_canonical preserves the existing production/site formula.
    # Use paper_gds only in the dedicated stability-validation profile first.
    collision_policy: "lula_canonical"
    collision_rmp_margin: 0.0
    # Extra clearance for moving-body / moving-body sphere pairs.  The
    # self-collision graph node stays disabled for existing launch profiles.
    self_collision_margin: 0.01
    # collision_rmp_damping_gain: 100.0
    collision_rmp_damping_gain: 20.0
    collision_rmp_damping_std_dev: 0.01
    collision_rmp_damping_robustness_eps: 0.1
    collision_rmp_damping_velocity_gate_length_scale: 0.03
    # collision_rmp_repulsion_gain: 100.0
    collision_rmp_repulsion_gain: 3000.0
    collision_rmp_repulsion_std_dev: 0.05
    collision_rmp_metric_modulation_radius: 0.2
    collision_rmp_metric_modulation_power: 2.0
    collision_rmp_far_field_plateau_start: 0.0
    collision_rmp_far_field_fade_width: 0.05
    # collision_rmp_metric_scalar: 0.0
    collision_rmp_metric_scalar: 100000.0
    # collision_rmp_metric_exploder_std_dev: 0.01
    # collision_rmp_metric_exploder_eps: 0.1
    collision_rmp_metric_exploder_std_dev: 0.02
    collision_rmp_metric_exploder_eps: 1.5
    collision_rmp_gds_clearance_smoothing: 0.0001
    collision_rmp_gds_metric_velocity_floor: 0.5
    collision_rmp_gds_metric_velocity_scale: 0.03
    collision_rmp_gds_damping_velocity_scale: 0.03
    # Target RMP

    # vel
    target_rmp_accel_p_gain: 40.0
    target_rmp_accel_d_gain: 120.0

    # Position
    # target_rmp_accel_p_gain: 80.0
    # target_rmp_accel_d_gain: 120.0
    target_rmp_accel_norm_eps: 0.08
    target_rmp_metric_alpha_length_scale: 0.01
    target_rmp_min_metric_alpha: 0.1
    target_rmp_max_metric_scalar: 100000.0
    target_rmp_min_metric_scalar: 25000.0
    target_rmp_proximity_metric_boost_scalar: 2.0
    target_rmp_proximity_metric_boost_length_scale: 0.02

    # Axis Target RMP
    axis_target_rmp_accel_p_gain: 80.0
    axis_target_rmp_accel_d_gain: 80.0
    axis_target_rmp_metric_scalar: 0.0 #10000.0
    axis_target_rmp_proximity_metric_boost_scalar: 10.0
    axis_target_rmp_proximity_metric_boost_length_scale: 0.01
    # Single SO(3) orientation policy. Kd=2*sqrt(Kp) is critically damped.
    so3_orientation_rmp_accel_p_gain: 64.0
    so3_orientation_rmp_accel_d_gain: 16.0
    so3_orientation_rmp_metric_scalar: 10000.0

    # Wrist-only Axis Target RMP
    wrist_axis_target_rmp_accel_p_gain: 100.0
    wrist_axis_target_rmp_accel_d_gain: 50.0
    wrist_axis_target_rmp_metric_scalar: 0.0
    wrist_axis_target_rmp_proximity_metric_boost_scalar: 1.0
    wrist_axis_target_rmp_proximity_metric_boost_length_scale: 0.01

    # Damping RMP
    # vel
    damping_rmp_accel_d_gain: 120.0
    damping_rmp_metric_scalar: 0.0

    # Position
    # damping_rmp_accel_d_gain: 80.0
    # damping_rmp_metric_scalar: 100.0

    damping_rmp_inertia: 300.0

    # C-space Target RMP
    cspace_target_metric_scalar: 1000.0
    cspace_target_position_gain: 5.0
    cspace_target_damping_gain: 30.0
    cspace_target_robust_position_term_thresh: 0.5
    cspace_target_inertia: 0.0

    # Joint Limit RMP
    joint_limit_policy: "lula_canonical"
    joint_limit_metric_scalar: 1000.0
    joint_limit_metric_length_scale: 0.1
    joint_limit_metric_exploder_eps: 0.001
    joint_limit_metric_velocity_gate_length_scale: 0.01
    joint_limit_accel_damper_gain: 100.0
    joint_limit_accel_potential_gain: 100.0
    joint_limit_accel_potential_exploder_eps: 0.001
    joint_limit_accel_potential_exploder_length_scale: 0.01
    joint_limit_gds_center_fraction: 0.5
    joint_limit_gds_domain_epsilon: 0.000000001

    # Joint Velocity Cap RMP
    joint_velocity_cap_max_velocity: 1.0
    joint_velocity_cap_velocity_damping_region: 0.5
    joint_velocity_cap_damping_gain: 500.0
    joint_velocity_cap_metric_weight: 100.0

    # Command limits
    max_joint_accel: 10.0
    preserve_joint_accel_direction: true
    # max_joint_accel: 1.5
    command_guard_max_velocity_rad_s: 1.0
    # Separate measured-to-command tracking corridor from the per-cycle slew cap.
    command_guard_max_following_error_rad: 0.02
    command_guard_velocity_slew_enabled: false
    command_guard_max_accel_rad_s2: 10.0
    # command_guard_max_velocity_rad_s: 0.5
    predictive_joint_limit_guard: true



    control_rate: 200.0
    # Disabled in normal runs. The rate benchmark enables this low-rate topic.
    publish_control_timing_debug: false
    control_timing_debug_topic: "/rmp_control_timing"
    control_timing_publish_rate: 10.0
    estimate_velocity_in_controller: false
    controller_velocity_filter_alpha: 0.5
    use_synced_input_velocity_filter: false
    synced_input_velocity_filter_type: "alpha-beta"
    synced_input_velocity_filter_alpha: 0.7
    synced_input_velocity_filter_beta: 0.04
    synced_input_velocity_ratio_tolerance: 0.05
    synced_input_velocity_max_raw_rad_s: 6.0
    synced_input_velocity_position_step_margin_rad: 0.01
    synced_input_velocity_max_output_rad_s: 2.0
    use_velocity_feedback_in_solver: true
    measured_position_feedback_blend: 1.0
    measured_velocity_feedback_blend: 0.25
    # Match the production B1 feedback condition. The launch-level defaults
    # also enforce observer ON and blend 1.00/0.25; these copied values are
    # kept consistent so the experiment has no hidden configuration mismatch.
    latency_compensation_enabled: true
    latency_compensation_delay_sec: 0.118
    latency_compensation_position_gain: 1.0
    latency_compensation_velocity_gain: 1.0
    latency_compensation_max_position_correction_rad: 0.05
    latency_compensation_max_velocity_correction_rad_s: 0.50
    latency_compensation_max_state_age_sec: 0.04
    latency_compensation_activation_ramp_sec: 0.25
    publish_latency_compensation_debug: false
    latency_compensation_debug_topic: "/rmp_latency_compensation"
    latency_compensation_debug_rate: 20.0
    visualization_rate: 20.0
    publish_visualization: true
    publish_goal_marker: true
    publish_control_point_markers: true
    # Legacy orange body-guard overlay is hidden by default; the canonical
    # robot-body representation is the 22 cyan BodyControlPointSpec spheres.
    publish_body_obstacle_markers: false
    publish_end_effector_pose: false
    publish_debug_state: false
    # Use each BodyControlPointSpec radius so controller and Step 2 RViz match.
    control_point_marker_diameter: 0.0
    publish_repulsion_metric_markers: false
    repulsion_metric_marker_min_norm: 0.01
    repulsion_metric_marker_dot_diameter: 0.04

    # TCP acceleration visualization
    publish_tcp_accel_marker: true
    tcp_accel_marker_topic: "tcp_accel_marker"
    tcp_accel_marker_max_length: 0.15
    tcp_accel_marker_norm_for_max_length: 2.0
    tcp_accel_marker_min_norm: 0.001
    enable_tangent_escape_rmp: false
    # Independent numeric values. The fixed-cylinder ON/OFF profile now gives
    # Escape the same base metric scale as Collision. The clearance margin
    # remains independent from Collision parameters at runtime.
    tangent_escape_rmp_clearance_margin: 0.0
    # In risk_damped mode its effective rank-one metric is m_t * lambda * B.
    # canonical_velocity-only compatibility gain (unused by risk_damped).
    # This is a Cartesian tangent-task limit (m/s^2). The resolved joint
    # acceleration still follows the independent global max_joint_accel limit.

    # --- Escape RMP v2 ("tangent_ode") -------------------------------------
    # Designed in canonical (a, M) form.  accel_max is a real tangential
    # acceleration [m/s^2] and tangent_damping is a rate [1/s], so 1/b_e is the
    # settling time and must stay far above the 5 ms control period.
    # accel_sigma is wide (prevention) while metric_sigma is narrow (authority);
    # gating the acceleration rather than the force is what keeps a bounded.
    tangent_escape_ode_metric_max: 100000.0
    tangent_escape_ode_metric_sigma: 0.03
    tangent_escape_ode_accel_max: 500.0
    tangent_escape_ode_accel_sigma: 0.08
    tangent_escape_ode_budget_scale: 1.0
    tangent_escape_ode_budget_recovery_time: 3.0
    tangent_escape_ode_tangent_damping: 40.0
    tangent_escape_ode_direction_rate: 3.0
    tangent_escape_ode_risk_sigma: 0.06
    tangent_escape_ode_weight_goal: 1.0
    tangent_escape_ode_weight_velocity: 0.3
    tangent_escape_ode_weight_risk: 1.0
    tangent_escape_ode_weight_curvature: 1.5
    tangent_escape_ode_axial_preference: 1.0
    tangent_escape_ode_pocket_threshold: 0.6
    tangent_escape_ode_pocket_epsilon: 0.1
    tangent_escape_ode_activation_distance: 0.15
    tangent_escape_ode_release_distance: 0.45
    tangent_escape_ode_switch_hysteresis: 0.005
    tangent_escape_ode_direction_memory_time: 1.0
    # Stall memory: pushing hard while going nowhere accumulates a penalty
    # on the directions already tried, so theta leaves a failing region
    # instead of oscillating between two maxima of the score.
    tangent_escape_ode_weight_stall: 2.0
    tangent_escape_ode_stall_time_constant: 1.5
    tangent_escape_ode_stall_speed: 0.02

    # tangent_plane-only; listed so the overlay's "params" sentinel resolves.

    # Compatibility/shared supervisor block. risk_damped ignores the old z-LPF,
    # desired-velocity, drive-ramp, and RELEASE parameters, while it still uses
    # intent, scoring, latch/handoff, max_speed, and failure-monitor settings.
    # The ignored values remain parsed only so canonical_velocity can be used
    # for an explicit rollback/A-B run; it is not selected by this profile.
    # Ignore nominal directions below intent_on_speed. Between on/full,
    # smoothly raise the confidence that the base RMP intends to move this CP.
    # Bound one continuously active Escape episode. The timeout uses the same
    # smooth lambda-down handoff as other releases; normal observed episodes
    # currently finish within 5.44 s, so 12 s is a failsafe-only threshold.

    publish_tangent_escape_rmp_data: false
    publish_tangent_escape_dual_solve_data: false
    tangent_escape_dual_solve_topic: "/tangent_escape_dual_solve"
    publish_leaf_ablation_data: false
    leaf_ablation_topic: "/rmp_leaf_ablation"

    # Tangent escape activation and candidate selection.

    # Escape/base stability certificate. Disabled in the normal production
    # profile; the dedicated proof launch enables the finite-energy guard.
    escape_stability_guard_enabled: false
    # The tank always starts full, so this is both capacity and initial energy.
    # Placeholder only. During gain calibration, override this with a large
    # simulation-only budget so scale remains 1; after successful Escape runs,
    # replace it with the measured mission requirement plus a validated margin.
    escape_stability_tank_capacity: 0.25
    escape_stability_scale_search_iterations: 16
    escape_stability_power_tolerance: 0.000000001
    publish_stability_certificate_data: false
    stability_certificate_data_topic: "/rmp_stability_certificate"

    publish_tangent_escape_geometry_debug: false
    tangent_escape_geometry_data_topic: "/tangent_escape_geometry_data"
    tangent_escape_geometry_marker_topic: "tangent_escape_geometry_markers"
    tangent_escape_geometry_marker_length: 0.12
    goal_x: 0.3
    goal_y: 0.0
    goal_z: 1.0
    min_goal_z: 0.05
    initialize_goal_from_first_state: true
    safety_stop_on_min_z: false
    workspace_floor_z: 0.0
    min_link6_z: 0.03
    min_tcp_z: 0.05
    initial_q: [0.0, -2.0943951024, 1.5707963268, -2.617993878, -1.5707963268, 0.0]
    default_q: [0.0, -2.0943951024, 1.5707963268, -2.617993878, -1.5707963268, 0.0]
    # The CB2 controller reports wrist_3 as an unwrapped multi-turn angle. Keep
    # its current branch commandable so startup does not clamp, for example,
    # -384 deg to -360 deg and immediately trip the following-error guard.
    joint_lower_limits_deg: [-360.0, -360.0, -180.0, -360.0, -360.0, -720.0]
    joint_upper_limits_deg: [360.0, 360.0, 180.0, 360.0, 360.0, 720.0]
    joint_limit_buffers: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
    backend_mode: "joint_command_topics"
    # Set false only for read-only hardware observation. No UR10 command socket is opened.
    hardware_command_enabled: true
    hardware_state_topic: "/ur10/joint_states"
    hardware_command_topic: "hardware_joint_command"
    joint_state_topic: "/ur10/joint_states"
    position_command_topic: "/ur10/targetJ"
    dry_run_command_topic: "/rmp_dry_run_command"
    publish_position_command: true
    position_command_state_topic: "/rmp_position_command"
    publish_rmp_accel_debug: false
    rmp_joint_accel_topic: "/rmp_joint_accel"
    rmp_tcp_accel_topic: "/rmp_tcp_accel"
    # position: servoj(q), velocity: speedj(qd)
    command_mode: "position"
    # SpeedJ parameters used only when command_mode is velocity.
    speedj_t1: 0.002
    speedj_t2: 0.1
    speedj_gain: 0.005
    speedj_alpha: 0.1
    publish_joint_states: true
    joint_state_publish_topic: "joint_states"
    publish_rmp_ee_pose: false
    publish_goal_tf: false
    goal_tf_parent_frame: "base_link"
    goal_tf_child_frame: "rmp_goal_target"
    enable_realtime: false
    realtime_priority: 80
    lock_memory: false
    body_goal: [0.45, 0.0, 0.9]
    orientation_goal: [0.0, 0.0, 1.0]
    solve_method: "rmp2"
    rmp_type: "canonical"
    external_rmp:
      topic_prefix: "external_rmp"
      admittance:
        enabled: true
        topic_prefix: "admittance"
    # RMP graph topology
    graph:
      node_names:
        - cspace_target
        - joint_limits
        - joint_velocity_cap
        - tcp_position
        - target
        - control_points
        - collision
        - self_collision
        - tangent_escape
        - damping
        - admittance_external
        - body_link4
        - tcp_axis_target_x
        - tcp_axis_target_y
        - tcp_axis_target_z
        - tcp_orientation_so3
      cspace_target:
        parents: [root]
        parent: root
        task_map: cspace_target
        leaf: cspace_target
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      joint_limits:
        parents: [root]
        parent: root
        task_map: joint_limit
        leaf: joint_limit
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      joint_velocity_cap:
        parents: [root]
        parent: root
        task_map: identity
        leaf: joint_velocity_cap
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      tcp_position:
        parents: [root]
        parent: root
        task_map: tcp_position
        leaf: none
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      target:
        parents: [tcp_position]
        parent: tcp_position
        task_map: identity
        leaf: target
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      control_points:
        parents: [root]
        parent: root
        task_map: control_points
        leaf: none
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      collision:
        parents: [control_points]
        parent: control_points
        task_map: collision_distance
        leaf: collision
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      self_collision:
        parents: [control_points]
        parent: control_points
        task_map: self_collision_distance
        leaf: collision
        enabled: false
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      tangent_escape:
        parents: [control_points]
        parent: control_points
        task_map: identity
        leaf: tangent_escape
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      damping:
        parents: [root]
        parent: root
        task_map: identity
        leaf: damping
        enabled: true
        target_key: goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      # Seventh policy: an externally computed joint-space admittance RMP.
      # The external publisher supplies a 6x6 metric square root and a
      # six-joint canonical acceleration. Missing input contributes exactly
      # zero to the root resolve.
      admittance_external:
        parents: [root]
        parent: root
        task_map: identity
        leaf: external
        enabled: true
        target_key: admittance
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      body_link4:
        parents: [root]
        parent: root
        task_map: link_position
        leaf: target
        enabled: false
        target_key: body_goal
        link_name: wrist_1_link
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      tcp_axis_target_x:
        parents: [root]
        parent: root
        task_map: link_orientation_axis
        leaf: axis_target
        enabled: true
        target_key: orientation_goal_x
        link_name: tool0
        axis: "x"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      tcp_axis_target_y:
        parents: [root]
        parent: root
        task_map: link_orientation_axis
        leaf: axis_target
        enabled: true
        target_key: orientation_goal_y
        link_name: tool0
        axis: "y"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      tcp_axis_target_z:
        parents: [root]
        parent: root
        task_map: link_orientation_axis
        leaf: axis_target
        enabled: true
        target_key: orientation_goal_z
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0
      tcp_orientation_so3:
        parents: [root]
        parent: root
        task_map: link_orientation
        leaf: so3_orientation_target
        enabled: false
        target_key: orientation_goal
        link_name: tool0
        axis: "z"
        handcrafted_leaf: none
        identity_multiplier: 0.0

    # UR10 body guard obstacles (spheres in each link's local frame)
    # upper_arm: extends along local -X (0 to -0.612m)
    # forearm: extends along local -X (0 to -0.572m), +Z offset at end
    # wrist_1: extends along local -Y (0 to -0.116m)
    # wrist_2: extends along local +Y (0 to +0.092m)
    body_obstacles:
      names:
        - shoulder_guard_1
        - shoulder_guard_2
        - upper_arm_guard_1
        - upper_arm_guard_2
        - upper_arm_guard_3
        - upper_arm_guard_4
        - upper_arm_guard_5
        - upper_arm_guard_6
        - upper_arm_guard_7
        - forearm_guard_1
        - forearm_guard_2
        - forearm_guard_3
        - forearm_guard_4
        - forearm_guard_5
        - forearm_guard_6
        - wrist1_guard_1
        - wrist1_guard_2
        - wrist1_guard_3
        - wrist2_guard_1
        - wrist2_guard_2
        - wrist2_guard_3
        - wrist3_guard_1
        - wrist3_guard_2
        - tool_guard_1
      # Shoulder: compact cylinder around pan joint
      shoulder_guard_1:
        type: "ball"
        link_name: "shoulder_link"
        center: [0.0, 0.0, 0.0]
        radius: 0.075
      shoulder_guard_2:
        type: "ball"
        link_name: "shoulder_link"
        center: [0.0, 0.0, -0.05]
        radius: 0.075
      # Upper arm: along local -X from 0 to -0.612
      upper_arm_guard_1:
        type: "ball"
        link_name: "upper_arm_link"
        center: [0.0, 0.0, 0.0]
        radius: 0.07
      upper_arm_guard_2:
        type: "ball"
        link_name: "upper_arm_link"
        center: [-0.1, 0.0, 0.0]
        radius: 0.065
      upper_arm_guard_3:
        type: "ball"
        link_name: "upper_arm_link"
        center: [-0.2, 0.0, 0.0]
        radius: 0.06
      upper_arm_guard_4:
        type: "ball"
        link_name: "upper_arm_link"
        center: [-0.3, 0.0, 0.0]
        radius: 0.06
      upper_arm_guard_5:
        type: "ball"
        link_name: "upper_arm_link"
        center: [-0.4, 0.0, 0.0]
        radius: 0.06
      upper_arm_guard_6:
        type: "ball"
        link_name: "upper_arm_link"
        center: [-0.5, 0.0, 0.0]
        radius: 0.06
      upper_arm_guard_7:
        type: "ball"
        link_name: "upper_arm_link"
        center: [-0.6, 0.0, 0.0]
        radius: 0.065
      # Forearm: along local -X from 0 to -0.572, slight +Z at end
      forearm_guard_1:
        type: "ball"
        link_name: "forearm_link"
        center: [0.0, 0.0, 0.0]
        radius: 0.06
      forearm_guard_2:
        type: "ball"
        link_name: "forearm_link"
        center: [-0.115, 0.0, 0.03]
        radius: 0.055
      forearm_guard_3:
        type: "ball"
        link_name: "forearm_link"
        center: [-0.23, 0.0, 0.06]
        radius: 0.05
      forearm_guard_4:
        type: "ball"
        link_name: "forearm_link"
        center: [-0.345, 0.0, 0.09]
        radius: 0.05
      forearm_guard_5:
        type: "ball"
        link_name: "forearm_link"
        center: [-0.46, 0.0, 0.12]
        radius: 0.05
      forearm_guard_6:
        type: "ball"
        link_name: "forearm_link"
        center: [-0.57, 0.0, 0.16]
        radius: 0.05
      # Wrist 1: along local -Y from 0 to -0.116
      wrist1_guard_1:
        type: "ball"
        link_name: "wrist_1_link"
        center: [0.0, 0.0, 0.0]
        radius: 0.045
      wrist1_guard_2:
        type: "ball"
        link_name: "wrist_1_link"
        center: [0.0, -0.058, 0.0]
